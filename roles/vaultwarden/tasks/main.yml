---
- name: Create vaultwarden group
  ansible.builtin.group:
    name: "{{ vaultwarden_group }}"
    gid: "{{ vaultwarden_gid }}"
    system: true

- name: Create vaultwarden user
  ansible.builtin.user:
    name: "{{ vaultwarden_user }}"
    uid: "{{ vaultwarden_uid }}"
    group: "{{ vaultwarden_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Verify data mountpoint
  ansible.builtin.command: mountpoint -q {{ vaultwarden_data_root }}
  register: vaultwarden_mount
  changed_when: false
  failed_when: vaultwarden_mount.rc != 0

- name: Create data directory
  ansible.builtin.file:
    path: "{{ vaultwarden_data_location }}"
    state: directory
    owner: "{{ vaultwarden_uid }}"
    group: "{{ vaultwarden_gid }}"
    mode: "0750"

- name: Create compose directory
  ansible.builtin.file:
    path: /opt/vaultwarden
    state: directory
    owner: root
    group: "{{ vaultwarden_gid }}"
    mode: "0750"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/vaultwarden/docker-compose.yml
    owner: root
    group: "{{ vaultwarden_gid }}"
    mode: "0640"
  notify: Restart vaultwarden

- name: Deploy .env file
  ansible.builtin.template:
    src: env.j2
    dest: /opt/vaultwarden/.env
    owner: root
    group: "{{ vaultwarden_gid }}"
    mode: "0640"
  notify: Restart vaultwarden

- name: Start vaultwarden stack
  community.docker.docker_compose_v2:
    project_src: /opt/vaultwarden
    state: present
    pull: always
  register: vaultwarden_up
  retries: 5
  delay: 30
  until: vaultwarden_up is not failed
