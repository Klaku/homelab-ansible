---
- name: Create nginx directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0750"
  loop:
    - "{{ nginx_base_dir }}"
    - "{{ nginx_conf_dir }}"
    - "{{ nginx_certs_dir }}"
    - "{{ nginx_logs_dir }}"

- name: Create compose directory
  ansible.builtin.file:
    path: /opt/nginx
    state: directory
    owner: root
    group: "root"
    mode: "0750"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/nginx/docker-compose.yml
    owner: root
    group: "root"
    mode: "0640"
  notify: Restart nginx

- name: Deploy main nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_base_dir }}/nginx.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy per-site configs
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ nginx_conf_dir }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: "0644"
  with_fileglob:
    - "{{ role_path }}/templates/sites/*.j2"
  loop_control:
    label: "{{ item | basename }}"
  notify: Reload nginx

# Certificates must exist before nginx starts: every server block references
# ssl_certificate, so nginx fails its config test (and never starts) on a fresh
# host if the certs are missing. certbot uses DNS-01 and does not need nginx
# running, so we issue first, then start.
- name: Include certbot tasks
  ansible.builtin.import_tasks: certbot.yml

- name: Start nginx
  community.docker.docker_compose_v2:
    project_src: /opt/nginx
    state: present
    pull: always
  register: nginx_up
  retries: 5
  delay: 30
  until: nginx_up is not failed
