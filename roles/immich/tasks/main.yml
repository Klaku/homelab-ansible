---
- name: Create immich group
  ansible.builtin.group:
    name: "{{ immich_group }}"
    gid: "{{ immich_gid }}"
    system: true

- name: Create immich user
  ansible.builtin.user:
    name: "{{ immich_user }}"
    uid: "{{ immich_uid }}"
    group: "{{ immich_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Verify data mountpoint
  ansible.builtin.command: mountpoint -q {{ immich_data_root }}
  register: immich_mount
  changed_when: false
  failed_when: immich_mount.rc != 0

- name: Create upload directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ immich_uid }}"
    group: "{{ immich_gid }}"
    mode: "0750"
  loop:
    - "{{ immich_upload_location }}"

- name: Create Postgres data directory
  ansible.builtin.file:
    path: "{{ immich_db_data_location }}"
    state: directory
    owner: "{{ immich_postgres_uid }}"
    group: "{{ immich_postgres_gid }}"
    mode: "0700"

- name: Create compose directory
  ansible.builtin.file:
    path: /opt/immich
    state: directory
    owner: root
    group: "{{ immich_gid }}"
    mode: "0750"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/immich/docker-compose.yml
    owner: root
    group: "{{ immich_gid }}"
    mode: "0640"
  notify: Restart immich

- name: Deploy ML hwaccel config
  ansible.builtin.template:
    src: hwaccel.ml.yml.j2
    dest: /opt/immich/hwaccel.ml.yml
    owner: root
    group: "{{ immich_gid }}"
    mode: "0640"
  notify: Restart immich

- name: Deploy transcoding hwaccel config
  ansible.builtin.template:
    src: hwaccel.transcoding.yml.j2
    dest: /opt/immich/hwaccel.transcoding.yml
    owner: root
    group: "{{ immich_gid }}"
    mode: "0640"
  notify: Restart immich

- name: Deploy .env file
  ansible.builtin.template:
    src: env.j2
    dest: /opt/immich/.env
    owner: root
    group: "{{ immich_gid }}"
    mode: "0640"
  notify: Restart immich

- name: Start immich stack
  community.docker.docker_compose_v2:
    project_src: /opt/immich
    state: present
    pull: always
  register: immich_up
  retries: 5
  delay: 30
  until: immich_up is not failed
