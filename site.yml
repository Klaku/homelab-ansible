- name: Bootstrap fresh Debian server
  hosts: linux
  remote_user: "{{ os_administrator }}"
  gather_facts: true
  roles:
    - bootstrap
    - base
    - firewall

- name: Configure direct attached storage (DAS)
  hosts: srv01
  become: true
  roles:
    - role: lvm
      vars:
        lvm_volume_groups:
          - name: vg_data
            devices:
              # Stable device path (survives reboots/re-plug, unlike /dev/sdX).
              # List candidates: ls -l /dev/disk/by-id/ | grep -i usb
              - /dev/disk/by-id/usb-External_USB3.0_20170331000D4-0:0
        lvm_logical_volumes:
          - name: lv_immich
            vg: vg_data
            size: "500G"
            mountpoint: /srv/immich
          - name: lv_vaultwarden
            vg: vg_data
            size: "10G"
            mountpoint: /srv/vaultwarden
          - name: lv_authentik
            vg: vg_data
            size: "10G"
            mountpoint: /srv/authentik

- name: Configure Docker hosts
  hosts: docker_hosts
  become: true
  roles:
    - docker

- name: Run Immich container
  hosts: srv01
  become: true
  tags: run
  roles:
    - immich